name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK with version
        run: |
          ./gradlew assembleDebug --stacktrace \
            -PversionName="${{ steps.ver.outputs.version_name }}" \
            -PversionCode="${{ steps.ver.outputs.version_code }}"

      - name: Rename APK with version
        run: |
          mkdir -p dist
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          DEST="dist/english-oral-practice-${{ steps.ver.outputs.tag }}-debug-unsigned.apk"
          cp "$SRC" "$DEST"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: |
            ## Android Debug 构建

            - **构建类型**: debug / unsigned（未签名）
            - **versionName**: ${{ steps.ver.outputs.version_name }}
            - **versionCode**: ${{ steps.ver.outputs.version_code }}

            ⚠️ 此包为 **debug/unsigned**，**不可上架**应用商店，仅供内测与安装验证。
          files: dist/english-oral-practice-${{ steps.ver.outputs.tag }}-debug-unsigned.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
